{% extends "base.html" %}

{% block title %}Kayıt Ol - Fatura Otomasyonu{% endblock %}

{% block content %}
<div class="section" style="max-width: 450px;">
  <div style="background: white; border-radius: 16px; padding: 40px; box-shadow: var(--shadow);">
    <h2 style="text-align: center; margin-bottom: 25px;">Ücretsiz Kayıt Ol</h2>
    
    <form method="POST" action="{{ url_for('register') }}">
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: 500;">E-Posta</label>
        <input type="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
      </div>
      
      <div style="margin-bottom: 25px;">
        <label style="display: block; margin-bottom: 5px; font-weight: 500;">Şifre (Min. 6 Karakter)</label>
        <input type="password" name="password" required minlength="6" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
      </div>

      <button type="submit" class="btn-nav-primary" style="width: 100%; padding: 12px; font-size: 1rem; border: none; cursor: pointer;">Hesap Oluştur</button>
    </form>

    <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--muted);">
      Zaten hesabınız var mı? <a href="{{ url_for('login') }}" style="color: var(--red); font-weight: 600;">Giriş Yapın</a>
    </p>
  </div>
</div>
{% endblock %}
