services:
  - type: web
    name: fatura-kontrol
    env: python
    plan: free
    buildCommand: apt-get update && apt-get install -y libreoffice --no-install-recommends && pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: fatura-data
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
